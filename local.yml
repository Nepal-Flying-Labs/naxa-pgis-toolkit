version: '3'

volumes:
  pgis_toolkit_local_postgres_data: {}
  pgis_toolkit_local_postgres_data_backups: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: pgis_toolkit_local_django
    container_name: pgis_toolkit_local_django
    # platform: linux/x86_64
    depends_on:
      - postgres
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: pgis_toolkit_production_postgres
    container_name: pgis_toolkit_local_postgres
    volumes:
      - pgis_toolkit_local_postgres_data:/var/lib/postgresql/data:Z
      - pgis_toolkit_local_postgres_data_backups:/backups:z
    env_file:
      - ./.envs/.local/.postgres

  redis:
    container_name: pgis_toolkit_local_redis
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - ./_redis_data:/var/lib/redis
      - ./redis/rc.local:/etc/rc.local

  worker:
    container_name: pgis_toolkit_worker_django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    restart: always
    command : "celery -A pgis_toolkit worker -f /logs/worker.log -l DEBUG"
    # entrypoint : "celery -A pgis_toolkit worker -l DEBUG -Q default --pool=solo"
    depends_on:
      - django
      - redis
    volumes:
      - .:/app:z
      - ./logs/:/logs/
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres

  pgadmin:
    image: dpage/pgadmin4
    env_file: ./.envs/.local/.pgadmin
    ports:
      - "5051:80"
    restart: always
    depends_on:
      - postgres

  geoserver:
      image: kartoza/geoserver:2.19.0
      volumes:
        - ./geoserver-data:/opt/geoserver/data_dir
      env_file:
        - ./.envs/.local/.geoserver
      ports:
        - 8080:8080
      restart: on-failure
      # networks:
      #   - changu_nw_prod
