version: '3'

volumes:
  pgis_toolkit_local_postgres_data: {}
  pgis_toolkit_local_postgres_data_backups: {}
  pgis_toolkit_local_mongo_data: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local_run/django/Dockerfile
    restart: always
    image: pgis_toolkit_local_django
    container_name: pgis_toolkit_local_django
    # platform: linux/x86_64
    depends_on:
      - postgres
      - mongo
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local_run/.django
      - ./.envs/.local_run/.postgres
      - ./.envs/.local_run/.mongo


    ports:
      - "8000:8000"
    command: /start


  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: pgis_toolkit_production_postgres
    container_name: pgis_toolkit_local_postgres
    volumes:
      - pgis_toolkit_local_postgres_data:/var/lib/postgresql/data:Z
      - pgis_toolkit_local_postgres_data_backups:/backups:z
    env_file:
      - ./.envs/.local_run/.postgres
    ports:
      - 5432:5432

  mongo:
    image: mongo
    container_name: pgis_toolkit_local_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: pgis_toolkit_mongo

    # env_file:
    #   - ./.envs/.local_run/.mongo
    volumes:
      - ./pgis_toolkit_local_mongo_data:/data/db
    ports:
      - 27017:27017

  redis:
    container_name: pgis_toolkit_local_redis
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - ./_redis_data:/var/lib/redis
      - ./redis/rc.local:/etc/rc.local

  worker:
    container_name: pgis_toolkit_worker_django
    build:
      context: .
      dockerfile: ./compose/local_run/django/Dockerfile
    restart: always
    command : "celery -A pgis_toolkit worker -f logs/worker.log -l DEBUG"
    # entrypoint : "celery -A pgis_toolkit worker -l DEBUG -Q default --pool=solo"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "celery --broker=redis://redis:6379/ inspect ping | grep OK"
    depends_on:
      - django
      - redis
    volumes:
      - .:/app:z
      - ./logs/:/logs/
    env_file:
      - ./.envs/.local_run/.django
      - ./.envs/.local_run/.postgres
      - ./.envs/.local_run/.mongo

  beat:
    build:
      context: .
      dockerfile: ./compose/local_run/django/Dockerfile
    restart: always
    entrypoint : "celery -A pgis_toolkit beat --loglevel=debug"
    depends_on:
      - django
      # - db
      - worker
    volumes:
      - .:/code
      - ./logs/:/logs/
    env_file:
      - ./.envs/.local_run/.django
      - ./.envs/.local_run/.postgres

